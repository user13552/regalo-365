name: Procesar notificaciones

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Llamar API
        run: |
          curl \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://regalo-365.vercel.app/api/procesar-notificaciones